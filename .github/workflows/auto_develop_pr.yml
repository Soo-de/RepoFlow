name: Auto PR & Merge to Develop

# Trigger on push to any branch except main and develop
on:
  push:
    branches-ignore:
      - 'main'
      - 'develop'

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  # Job 1: Run Pytest suite
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest
        run: |
          pytest

  # Job 2: AI Agent PR & Auto-Merge (Triggers ONLY when commit contains [ship] or [ready])
  ai-auto-merge:
    name: AI Agent PR & Merge
    needs: test
    runs-on: ubuntu-latest
    # Only run if latest commit message contains [ship], [ready], or [merge]
    if: |
      contains(github.event.head_commit.message, '[ship]') ||
      contains(github.event.head_commit.message, '[ready]') ||
      contains(github.event.head_commit.message, '[merge]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run AI Agent PR Summarizer
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: 'develop'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python .github/scripts/ai_pr_agent.py

      - name: Create PR & Merge to Develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: 'develop'
        run: |
          # 1. Check if PR already exists
          PR_EXISTS=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number')

          if [ -z "$PR_EXISTS" ] || [ "$PR_EXISTS" == "null" ]; then
            echo "Creating PR using AI Agent summary..."
            PR_URL=$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$HEAD_BRANCH" \
              --title "feat($HEAD_BRANCH): auto-merge into develop" \
              --body-file pr_body.md)
            echo "PR created: $PR_URL"
            PR_NUM=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --json number --jq '.[0].number')
          else
            echo "Existing PR #$PR_EXISTS found. Updating PR body with AI summary..."
            gh pr edit "$PR_EXISTS" --body-file pr_body.md
            PR_NUM=$PR_EXISTS
          fi

          # 2. Merge PR into develop
          echo "Merging PR #$PR_NUM into $BASE_BRANCH..."
          gh pr merge "$PR_NUM" --squash --admin || gh pr merge "$PR_NUM" --squash
          echo "Successfully merged PR #$PR_NUM into $BASE_BRANCH!"
