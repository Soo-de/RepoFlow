name: Auto PR & Merge to Develop

# Trigger on push to any branch except main and develop
on:
  push:
    branches-ignore:
      - 'main'
      - 'develop'

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: write

jobs:
  # Job 1: Run Pytest suite
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Pytest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest || [ $? -eq 5 ]

  # Job 2: AI Agent PR & Auto-Merge (Triggers ONLY when commit contains [ship] or [ready])
  ai-auto-merge:
    name: AI Agent PR & Merge
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      checks: read

    # Only run if latest commit message contains [ship], [ready], or [merge]
    if: |
      contains(github.event.head_commit.message, '[ship]') ||
      contains(github.event.head_commit.message, '[ready]') ||
      contains(github.event.head_commit.message, '[merge]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Bot Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run AI Agent PR Summarizer
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: 'develop'
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'groq' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python .github/scripts/ai_pr_agent.py || echo "AI summarizer warning, falling back to default summary."

      - name: Create PR & Merge to Develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
          BASE_BRANCH: 'develop'
        run: |
          bash .github/scripts/merge_pr.sh
