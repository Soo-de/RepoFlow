{% extends "base.html" %}

{% block title %}RepoFlow — Job {{ job_id[:8] }}{% endblock %}

{% block content %}
<section class="status-container">
    <h1>Pipeline Generation</h1>

    <div class="status-card"
         hx-get="/status/{{ job_id }}"
         hx-trigger="every 2s"
         hx-swap="innerHTML"
         hx-target=".status-card">
        <p class="job-id">Job: <code>{{ job_id[:8] }}</code></p>
        <div class="status-indicator">
            <span class="badge badge-{{ status }}">{{ status }}</span>
        </div>
        <div class="loader"></div>
    </div>
</section>
{% endblock %}
