name: CI
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Python Application
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '>=3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run test suite
        run: |
          pytest --junitxml=junit/test-results.xml
          echo "### Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "Total tests run: $(grep 'collected' junit/test-results.xml | awk '{print $3}') tests" >> $GITHUB_STEP_SUMMARY
          echo "Total tests passed: $(grep 'passed' junit/test-results.xml | awk '{print $3}') tests" >> $GITHUB_STEP_SUMMARY
          echo "Total tests failed: $(grep 'failures' junit/test-results.xml | awk '{print $3}') tests" >> $GITHUB_STEP_SUMMARY
          echo "Total tests skipped: $(grep 'skipped' junit/test-results.xml | awk '{print $3}') tests" >> $GITHUB_STEP_SUMMARY
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit/test-results.xml
        if: always()