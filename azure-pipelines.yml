trigger:
  branches:
    include:
    - main
  paths:
    include:
    - '**'
pr:
  branches:
    include:
    - main
  paths:
    include:
    - '**'
stages:
- stage: CI
  displayName: CI
  jobs:
  - job: Test
    displayName: Test Job
    pool:
      vmImage: ubuntu-latest
    variables:
      pythonVersion: 3.11
    steps:
    - task: UsePythonVersion@0
      displayName: Set up Python 3.11
      inputs:
        version: $(pythonVersion)
    - task: Cache@2
      displayName: Cache Python dependencies
      inputs:
        key: python | "$(Agent.OS)" | "$(Build.SourcesDirectory)/pyproject.toml"
        paths:
        - '**/$(pythonVersion)/lib/python*/site-packages'
    - task: Bash@3
      displayName: Install dependencies
      inputs:
        command: bash
        workingDirectory: $(Build.SourcesDirectory)
      script: |
        pip install -e .
    - task: Bash@3
      displayName: Run tests
      inputs:
        command: bash
        workingDirectory: $(Build.SourcesDirectory)
      script: |
        pytest
    - task: PublishTestResults@2
      displayName: Publish test results
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: '**/test-results.xml'
        testRunTitle: Test Results
      condition: succeededOrFailed()